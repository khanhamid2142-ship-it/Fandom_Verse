<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeFlix — Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="background"></div>
    <div class="background-overlay"></div>
    <div class="grain"></div>


    <nav class="login-nav">

        <a href="index.html" class="logo">

            <img class="brand-image" src="images/fv-logo.png" alt="AnimeFlix">

           

        </a>


        <a href="signin.html" class="signup-link">
            Sign In
        </a>

    </nav>


    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <div class="icon">
                    <i class="bi bi-person-plus"></i>
                </div>

                <span class="kicker">
                    JOIN THE VERSE
                </span>

                <h1 style="color: white;">Create Account</h1>

                <p style="color: rgba(255, 255, 255, .4);">
                    Create your account and start your anime journey.
                </p>

            </div>


            <form id="signupForm">


                <div class="input-group-custom">

                    <label for="name">
                        NAME
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                </div>


                <div class="input-group-custom">

                    <label for="email">
                        EMAIL
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="input-group-custom">

                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                </div>


                <div class="input-group-custom">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-shield-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >

                    <span>CREATE ACCOUNT</span>

                    <i class="bi bi-arrow-right"></i>

                </button>


            </form>


            <p class="signup-text">

                Already have an account?

                <a href="signin.html">
                    Sign in
                </a>

            </p>

        </section>

    </main>


    <footer>

        <span>© 2026 AnimeFlix</span>

        <span>•</span>

        <span>
            Stream. Discover. Enjoy.
        </span>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
