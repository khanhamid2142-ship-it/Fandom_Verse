```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeFlix — Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="background"></div>
    <div class="background-overlay"></div>
    <div class="grain"></div>

    <nav class="login-nav">
        <a href="index.html" class="logo">
            <img class="brand-image" src="images/fv-logo.png" alt="AnimeFlix">
            
        </a>

        <a href="signup.html" class="signup-link">
            Create Account
        </a>
    </nav>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">
                <div class="icon">
                    <i class="bi bi-stars"></i>
                </div>

                <span class="kicker">WELCOME BACK</span>

                <h1 style="color: white;">Sign In</h1>

                <p style="color: rgba(150, 149, 149, 0.7) ;">
                    Continue your journey through the world of anime.
                </p>
            </div>

          <form id="loginForm">

    <div class="input-group-custom">
        <label for="email">EMAIL</label>

        <div class="input-wrapper">
            <i class="bi bi-envelope"></i>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>
    </div>

    <div class="input-group-custom">
        <label for="password">PASSWORD</label>

        <div class="input-wrapper">

            <i class="bi bi-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
            >
                <i class="bi bi-eye"></i>
            </button>

        </div>
    </div>

    <button type="submit" class="login-button">
        <span>SIGN IN</span>
        <i class="bi bi-arrow-right"></i>
    </button>

</form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="guest-button">
                <i class="bi bi-person"></i>
                Continue as Guest
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>

    </main>

    <footer>
        <span>© 2026 AnimeFlix</span>
        <span>•</span>
        <span>Stream. Discover. Enjoy.</span>
    </footer>


    <script src="js/auth.js"></script>
    <script>
        const password = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", () => {

            const isPassword = password.type === "password";

            password.type = isPassword ? "text" : "password";

            passwordToggle.innerHTML = isPassword
                ? '<i class="bi bi-eye-slash"></i>'
                : '<i class="bi bi-eye"></i>';

        });
    </script>

</body>

</html>
